# general settings
name: MAENet_GoPro #debug
model_type: ImageEventRestorationModel
scale: 1
num_gpu:  1 #4
manual_seed: 10

datasets:
  train:
    name: gopro-h5-train
    type: H5ImageDataset

    # dataroot: F:/GOPRO_rawevents/av_train_small6
    dataroot: /data/zhijing/GOPRO_rawevent/asynav_train

    # keep true if use events
    norm_voxel: true
    return_voxel: true

    return_mask: false
    use_mask: false

    filename_tmpl: '{}'
    io_backend:
      type: h5

    crop_size: 256
    use_flip: true
    use_rot: true

    # data loader settings
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2 # 4 for 2080, 8 for titan
    dataset_enlarge_ratio: 1  # accelarate, equals to the num_gpu
    prefetch_mode: cuda
    pin_memory: true

  val:
    name: gopro-h5-test
    type: H5ImageDataset

    # dataroot: F:/GOPRO_rawevents/av_test_small6
    dataroot: /data/zhijing/GOPRO_rawevent/asynav_test # for debug

    norm_voxel: true
    return_voxel: true
    return_mask: false
    use_mask: false

    io_backend:
      type: h5
    
    crop_size: ~
    use_flip: false
    use_rot: false

dataset_name: GoPro

# network structures
network_g:
  type: Baseline_Biattention_CrossRecurrent_FC
  in_chn: 3
  ev_chn: 6
  width: 64
  middle_blk_num: 3
  enc_blk_nums: [2,2,2]
  dec_blk_nums: [2,2,2]
  num_heads: [2,4,4]

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  training_states: ~ # save current trainig model states, for resume
  root: /output

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-5
    betas: [0.9, 0.99]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 400000
    eta_min: !!float 1e-7

  total_iter: 400000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: PSNRLoss
    loss_weight: 0.5
    reduction: mean

# validation settings
val:
  val_freq: !!float 4e4 # 2e4
  save_img: false
  grids: ~  
  crop_size: ~ 
  max_minibatch: 8  

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false   

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 2e4
  use_tb_logger: true
  wandb: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
