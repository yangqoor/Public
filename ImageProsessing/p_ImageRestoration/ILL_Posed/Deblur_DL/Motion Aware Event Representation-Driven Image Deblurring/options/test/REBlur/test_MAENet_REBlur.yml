# general settings
name: MAENet_REBlur_test
model_type: TestImageEventRestorationModel
scale: 1
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 10

# dataset and data loader settings
datasets:
  test:
    name: gopro-bestmodel-test
    type: H5ImageDataset

    dataroot: /data/zhijing/GOPRO_rawevent/REBlur_testav6 # for debug

    # add
    norm_voxel: true
    return_voxel: true
    return_gt_frame: true
    return_mask: false
    use_mask: false

    crop_size: ~
    use_flip: false
    use_rot: false
    io_backend:
      type: h5

dataset_name: REBlur

# network structures
network_g:
  type: Baseline_Biattention_CrossRecurrent_FC
  in_chn: 3
  ev_chn: 6
  width: 64
  middle_blk_num: 3
  enc_blk_nums: [2,2,2]
  dec_blk_nums: [2,2,2]
  num_heads: [2,4,4]


# path
path:
  pretrain_network_g: /model/zhijing/Baseline_Biattention/experiments/Baseline_Biattention_CrossRecurrent_FC_REBlur/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~
  root: /model/zhijing/Baseline_Biattention  # set this option ONLY in TEST!!!

# validation settings
val:
  save_img: true
  save_img_path: /output
  grids: ~
  crop_size: ~
  max_minibatch: 8 
  rgb2bgr: false # to my h5 data, its false
  metrics: {
    PSNR: {
      type: calculate_psnr,
      crop_border: 0
    }
  }

# dist training settings
dist_params:
  backend: nccl
  port: 29500
